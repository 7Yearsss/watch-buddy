# XcodeGen (decision 9): `brew install xcodegen && xcodegen generate` makes Pulseling.xcodeproj, which stays out of git.
# Layout and reasons: docs/design/11-后台与App落地方案.md, "二、App 架构".
name: Pulseling
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: $(PULSELING_TEAM)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  PulselingKit:
    path: Packages/PulselingKit

targets:
  Pulseling:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
    dependencies:
      - package: PulselingKit
      - target: PulselingWatch
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Pulseling
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSHealthShareUsageDescription: "Pulseling 只读取步数、睡眠、心率和运动记录，用来养你的宠物。不会写入，也不会上传原始记录。"
        NSHealthUpdateUsageDescription: "Pulseling 不会写入健康数据。"
        PulselingAppGroup: group.$(BUNDLE_PREFIX).shared
    entitlements:
      path: iOS/Pulseling.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        aps-environment: development
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX)
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: Pulseling
    scheme:
      testTargets: []

  PulselingWatch:
    type: application
    platform: watchOS
    sources:
      - Watch
      - Shared
    dependencies:
      - package: PulselingKit
      - target: PulselingWatchWidgets
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Pulseling
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_PREFIX)
        NSHealthShareUsageDescription: "手表只读取最新的运动记录，用来在你运动完时让宠物欢呼。"
        PulselingAppGroup: group.$(BUNDLE_PREFIX).shared
    entitlements:
      path: Watch/PulselingWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
    scheme: {}

  PulselingWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidgets
    dependencies:
      - package: PulselingKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Pulseling
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        PulselingAppGroup: group.$(BUNDLE_PREFIX).shared
    entitlements:
      path: WatchWidgets/PulselingWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).watchkitapp.widgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
