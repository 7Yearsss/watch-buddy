# Builds the iPhone and watch apps on GitHub's Macs (docs/design/11, S2), so the Swift side compiles on every push
# even without a Mac at hand. The TestFlight job needs an Apple developer account (decision 8) and these secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64  App Store Connect API key (Users and Access → Integrations), .p8 as base64
#   APPLE_TEAM_ID                                  10-character team id
#   BUNDLE_PREFIX                                  e.g. com.yourname.pulseling (the App ID registered for the app)
name: apple

on:
  push:
    paths: ["apps/apple/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apps/apple/**", ".github/workflows/apple.yml"]
  workflow_dispatch:
    inputs:
      testflight:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: PulselingKit tests (day rules, upload body)
        run: swift test --package-path apps/apple/Packages/PulselingKit
      - name: Generate the Xcode project
        working-directory: apps/apple
        run: brew install xcodegen && xcodegen generate
      - name: Build iPhone app with the watch app and widgets (simulator, unsigned)
        working-directory: apps/apple
        run: >
          xcodebuild build -project Pulseling.xcodeproj -scheme Pulseling
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      BUNDLE_PREFIX: ${{ secrets.BUNDLE_PREFIX }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM BUNDLE_PREFIX; do
            [ -n "${!v}" ] || { echo "::error::Missing secret for $v (see the top of .github/workflows/apple.yml)"; exit 1; }
          done
      - name: API key
        run: echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/asc.p8"
      - name: Generate the Xcode project
        working-directory: apps/apple
        run: brew install xcodegen && xcodegen generate
      - name: Archive (cloud signing via the API key)
        working-directory: apps/apple
        run: >
          xcodebuild archive -project Pulseling.xcodeproj -scheme Pulseling
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Pulseling.xcarchive"
          -skipPackagePluginValidation -skipMacroValidation -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          PULSELING_TEAM="$TEAM" BUNDLE_PREFIX="$BUNDLE_PREFIX" CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          | xcbeautify --renderer github-actions
      - name: Upload to TestFlight
        working-directory: apps/apple
        run: >
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Pulseling.xcarchive"
          -exportOptionsPlist Config/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/asc.p8" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
